<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TiempoVecino - Banco de Tiempo Hiperlocal</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        sage: { 50: '#f4f7f4', 100: '#e5ede5', 500: '#739072', 600: '#587157', 700: '#425441' },
                        terracotta: { 500: '#d97757', 600: '#b85c3c' },
                        cream: '#fcfbfa'
                    }
                }
            }
        }
    </script>
    <!-- React & ReactDOM & Babel CDN -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-cream text-stone-800 antialiased font-sans">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const INITIAL_USERS = [
            { id: 'u1', name: 'Laura Gómez', neighborhood: 'Fuenlabrada Centro', hours: 4.5, rating: 4.9, reviewsCount: 14, verified: true, badges: ['Vecino Verificado', '10+ Intercambios'], avatar: 'https://images.unsplash.com/photo-1494790108377-be9c29b29330?w=150' },
            { id: 'u2', name: 'Carlos Ruiz', neighborhood: 'El Arroyo', hours: 2.0, rating: 4.7, reviewsCount: 8, verified: true, badges: ['Vecino Verificado'], avatar: 'https://images.unsplash.com/photo-1500648767791-00dcc994a43e?w=150' },
            { id: 'u3', name: 'Ana Belén Pastor', neighborhood: 'La Serna', hours: 5.5, rating: 5.0, reviewsCount: 22, verified: true, badges: ['Top Ayudante', 'Vecino Verificado'], avatar: 'https://images.unsplash.com/photo-1438761681033-6461ffad8d80?w=150' },
            { id: 'u4', name: 'David El Khoury', neighborhood: 'Naranjo', hours: 1.0, rating: 4.5, reviewsCount: 5, verified: false, badges: [], avatar: 'https://images.unsplash.com/photo-1472099645785-5658abf4ff4e?w=150' }
        ];

        const INITIAL_LISTINGS = [
            { id: 'l1', userId: 'u1', userName: 'Laura Gómez', userAvatar: 'https://images.unsplash.com/photo-1494790108377-be9c29b29330?w=150', userNeighborhood: 'Fuenlabrada Centro', type: 'offer', title: 'Clases de conversación en inglés', category: 'Clases e Idiomas', description: 'Nivel nativo/bilingüe. Practicamos fluidez, pronunciación y vocabulario para viajes o trabajo.', hours: 1.0, mode: 'Presencial / Online' },
            { id: 'l2', userId: 'u2', userName: 'Carlos Ruiz', userAvatar: 'https://images.unsplash.com/photo-1500648767791-00dcc994a43e?w=150', userNeighborhood: 'El Arroyo', type: 'offer', title: 'Arreglo enchufes y persianas', category: 'Reparaciones y Bricolaje', description: 'Pequeñas chapucillas del hogar, cambio de mecanismos eléctricos, colgar lámparas y arreglar lamas de persiana.', hours: 1.5, mode: 'Presencial' },
            { id: 'l3', userId: 'u3', userName: 'Ana Belén Pastor', userAvatar: 'https://images.unsplash.com/photo-1438761681033-6461ffad8d80?w=150', userNeighborhood: 'La Serna', type: 'offer', title: 'Paseo perros por las tardes', category: 'Cuidado de Mascotas', description: 'Amante de los animales. Paseo perros medianos o pequeños por el parque de los Estados.', hours: 1.0, mode: 'Presencial' },
            { id: 'l4', userId: 'u4', userName: 'David El Khoury', userAvatar: 'https://images.unsplash.com/photo-1472099645785-5658abf4ff4e?w=150', userNeighborhood: 'Naranjo', type: 'offer', title: 'Ayuda con trámites digitales y certificado', category: 'Tecnología e Informática', description: 'Te ayudo con la Sede Electrónica, cita previa médica, Cl@ve y certificado digital paso a paso.', hours: 1.0, mode: 'Presencial / Online' },
            { id: 'l5', userId: 'u1', userName: 'Laura Gómez', userAvatar: 'https://images.unsplash.com/photo-1494790108377-be9c29b29330?w=150', userNeighborhood: 'Fuenlabrada Centro', type: 'offer', title: 'Clases de repaso de Matemáticas 2º Bachillerato', category: 'Clases e Idiomas', description: 'Ayuda intensiva para preparar selectividad y exámenes trimestrales.', hours: 1.5, mode: 'Presencial' },
            { id: 'l6', userId: 'u2', userName: 'Carlos Ruiz', userAvatar: 'https://images.unsplash.com/photo-1500648767791-00dcc994a43e?w=150', userNeighborhood: 'El Arroyo', type: 'request', title: 'Necesito ayuda para montar estantería IKEA', category: 'Reparaciones y Bricolaje', description: 'Tengo una Billy grande y me falta una mano para fijarla a la pared con seguridad.', hours: 1.5, mode: 'Presencial' }
        ];

        function App() {
            const [currentUser, setCurrentUser] = useState(() => {
                const saved = localStorage.getItem('tv_current_user');
                return saved ? JSON.parse(saved) : INITIAL_USERS[0];
            });

            const [users, setUsers] = useState(() => {
                const saved = localStorage.getItem('tv_users');
                return saved ? JSON.parse(saved) : INITIAL_USERS;
            });

            const [listings, setListings] = useState(() => {
                const saved = localStorage.getItem('tv_listings');
                return saved ? JSON.parse(saved) : INITIAL_LISTINGS;
            });

            const [exchanges, setExchanges] = useState(() => {
                const saved = localStorage.getItem('tv_exchanges');
                return saved ? JSON.parse(saved) : [
                    { id: 'ex1', listingId: 'l1', listingTitle: 'Clases de conversación en inglés', requesterId: 'u2', providerId: 'u1', hours: 1.0, status: 'accepted', messages: [{ sender: 'u2', text: 'Hola Laura, ¿te viene bien el martes a las 17:00 en la biblioteca?', time: 'Ayer 18:30' }, { sender: 'u1', text: '¡Perfecto! Nos vemos allí.', time: 'Ayer 19:00' }] }
                ];
            });

            const [activeTab, setActiveTab] = useState('explore');
            const [feedTab, setFeedTab] = useState('offer');
            const [selectedCategory, setSelectedCategory] = useState('Todas');
            const [selectedNeighborhood, setSelectedNeighborhood] = useState('Todos');
            const [searchQuery, setSearchQuery] = useState('');
            const [exchangeFilter, setExchangeFilter] = useState('all');

            const [newListing, setNewListing] = useState({ type: 'offer', title: '', category: 'Clases e Idiomas', description: '', hours: 1.0, mode: 'Presencial' });
            const [activeChatExchange, setActiveChatExchange] = useState(null);
            const [chatMessageText, setChatMessageText] = useState('');

            useEffect(() => {
                localStorage.setItem('tv_current_user', JSON.stringify(currentUser));
                localStorage.setItem('tv_users', JSON.stringify(users));
                localStorage.setItem('tv_listings', JSON.stringify(listings));
                localStorage.setItem('tv_exchanges', JSON.stringify(exchanges));
            }, [currentUser, users, listings, exchanges]);

            useEffect(() => {
                if (window.lucide) window.lucide.createIcons();
            });

            const categories = ['Todas', 'Clases e Idiomas', 'Reparaciones y Bricolaje', 'Cuidado de Mascotas', 'Tecnología e Informática', 'Acompañamiento y Recados', 'Cocina y Hogar'];
            const neighborhoods = ['Todos', '28941 Fuenlabrada Centro', '28942 El Arroyo', '28943 La Serna', '28945 Loranca', '28946 Parque Miraflores'];

            const handleCreateListing = (e) => {
                e.preventDefault();
                if (!newListing.title || !newListing.description) return;
                const created = {
                    id: 'l_' + Date.now(),
                    userId: currentUser.id,
                    userName: currentUser.name,
                    userAvatar: currentUser.avatar,
                    userNeighborhood: currentUser.neighborhood,
                    ...newListing
                };
                setListings([created, ...listings]);
                setNewListing({ type: 'offer', title: '', category: 'Clases e Idiomas', description: '', hours: 1.0, mode: 'Presencial' });
                setActiveTab('explore');
            };

            const requestExchange = (listing) => {
                if (listing.userId === currentUser.id) {
                    alert('No puedes solicitar tu propio anuncio.');
                    return;
                }
                if (currentUser.hours - listing.hours < -2.0) {
                    alert('Límite de deuda alcanzado (-2.0h). Necesitas ofrecer algún servicio antes de solicitar más.');
                    return;
                }

                const updatedUser = { ...currentUser, hours: currentUser.hours - listing.hours };
                setCurrentUser(updatedUser);
                setUsers(users.map(u => u.id === updatedUser.id ? updatedUser : u));

                const newEx = {
                    id: 'ex_' + Date.now(),
                    listingId: listing.id,
                    listingTitle: listing.title,
                    requesterId: currentUser.id,
                    providerId: listing.userId,
                    hours: listing.hours,
                    status: 'accepted',
                    messages: [{ sender: currentUser.id, text: `¡Hola! He solicitado tu servicio "${listing.title}". ¿Cuándo te vendría bien?`, time: 'Justo ahora' }]
                };

                setExchanges([newEx, ...exchanges]);
                setActiveChatExchange(newEx);
                setActiveTab('exchanges');
            };

            const completeExchange = (exId) => {
                const ex = exchanges.find(e => e.id === exId);
                if (!ex || ex.status === 'completed') return;

                setUsers(users.map(u => {
                    if (u.id === ex.providerId) {
                        return { ...u, hours: u.hours + ex.hours };
                    }
                    return u;
                }));

                if (currentUser.id === ex.providerId) {
                    setCurrentUser({ ...currentUser, hours: currentUser.hours + ex.hours });
                }

                setExchanges(exchanges.map(e => e.id === exId ? { ...e, status: 'completed' } : e));
                alert('¡Intercambio completado con éxito! Las horas han sido transferidas.');
            };

            const sendChatMessage = (e) => {
                e.preventDefault();
                if (!chatMessageText.trim() || !activeChatExchange) return;
                const updatedMessages = [...activeChatExchange.messages, { sender: currentUser.id, text: chatMessageText, time: 'Hace un momento' }];
                const updatedEx = { ...activeChatExchange, messages: updatedMessages };
                setExchanges(exchanges.map(ex => ex.id === updatedEx.id ? updatedEx : ex));
                setActiveChatExchange(updatedEx);
                setChatMessageText('');
            };

            const filteredListings = listings.filter(l => {
                if (feedTab && l.type !== feedTab) return false;
                if (selectedCategory !== 'Todas' && l.category !== selectedCategory) return false;
                if (selectedNeighborhood !== 'Todos' && l.userNeighborhood !== selectedNeighborhood) return false;
                if (searchQuery && !l.title.toLowerCase().includes(searchQuery.toLowerCase()) && !l.description.toLowerCase().includes(searchQuery.toLowerCase())) return false;
                return true;
            });

            const filteredExchanges = exchanges.filter(ex => {
                if (ex.requesterId !== currentUser.id && ex.providerId !== currentUser.id) return false;
                if (exchangeFilter === 'active' && ex.status !== 'accepted') return false;
                if (exchangeFilter === 'completed' && ex.status !== 'completed') return false;
                return true;
            });

            return (
                <div className="min-h-screen pb-24 max-w-md mx-auto bg-white shadow-2xl relative flex flex-col font-sans">
                    {/* Header */}
                    <header className="bg-sage-600 text-white p-4 sticky top-0 z-35 shadow-md flex justify-between items-center">
                        <div className="flex items-center space-x-2">
                            <span className="text-2xl">🌱</span>
                            <h1 className="text-lg font-bold tracking-wide">TiempoVecino</h1>
                        </div>
                        <div className="flex items-center space-x-3">
                            <div className="bg-sage-700 px-3 py-1.5 rounded-full text-xs font-semibold flex items-center space-x-1 shadow-inner border border-sage-500">
                                <span className="text-amber-300 font-bold text-sm">⏱ {currentUser.hours.toFixed(1)}h</span>
                            </div>
                            <select 
                                className="bg-sage-700 text-xs text-white p-1 rounded border border-sage-500 outline-none"
                                value={currentUser.id}
                                onChange={(e) => {
                                    const u = users.find(x => x.id === e.target.value);
                                    if (u) setCurrentUser(u);
                                }}
                            >
                                {users.map(u => <option key={u.id} value={u.id}>{u.name.split(' ')[0]}</option>)}
                            </select>
                        </div>
                    </header>

                    {/* Main views */}
                    <main className="flex-1 overflow-y-auto">
                        {activeTab === 'explore' && (
                            <div className="p-4 space-y-4">
                                <div className="flex bg-sage-50 p-1 rounded-xl">
                                    <button 
                                        onClick={() => setFeedTab('offer')}
                                        className={`flex-1 py-2 text-xs font-bold rounded-lg transition ${feedTab === 'offer' ? 'bg-sage-600 text-white shadow' : 'text-stone-600 hover:text-stone-900'}`}
                                    >
                                        🤝 Servicios Ofrecidos ({listings.filter(l => l.type === 'offer').length})
                                    </button>
                                    <button 
                                        onClick={() => setFeedTab('request')}
                                        className={`flex-1 py-2 text-xs font-bold rounded-lg transition ${feedTab === 'request' ? 'bg-terracotta-500 text-white shadow' : 'text-stone-600 hover:text-stone-900'}`}
                                    >
                                        🆘 Peticiones ({listings.filter(l => l.type === 'request').length})
                                    </button>
                                </div>

                                <div className="space-y-2">
                                    <input 
                                        type="text" 
                                        placeholder="Buscar servicio en Fuenlabrada..." 
                                        value={searchQuery}
                                        onChange={(e) => setSearchQuery(e.target.value)}
                                        className="w-full px-3 py-2 text-sm bg-stone-50 border border-stone-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-sage-500"
                                    />
                                    <div className="flex gap-2">
                                        <select 
                                            value={selectedNeighborhood} 
                                            onChange={(e) => setSelectedNeighborhood(e.target.value)}
                                            className="w-full bg-stone-100 border border-stone-200 rounded-lg px-2 py-1 text-xs text-stone-700 outline-none"
                                        >
                                            {neighborhoods.map(n => <option key={n} value={n}>Barrio: {n}</option>)}
                                        </select>
                                    </div>
                                    <div className="flex gap-1.5 overflow-x-auto pb-2 scrollbar-none">
                                        {categories.map(cat => (
                                            <button 
                                                key={cat}
                                                onClick={() => setSelectedCategory(cat)}
                                                className={`px-3 py-1 rounded-full text-xs whitespace-nowrap transition ${selectedCategory === cat ? 'bg-stone-800 text-white font-medium' : 'bg-stone-100 text-stone-600 hover:bg-stone-200'}`}
                                            >
                                                {cat}
                                            </button>
                                        ))}
                                    </div>
                                </div>

                                <div className="space-y-3">
                                    {filteredListings.length === 0 ? (
                                        <div className="text-center py-12 text-stone-400 text-sm">
                                            No hay anuncios activos con estos filtros.
                                        </div>
                                    ) : (
                                        filteredListings.map(item => (
                                            <div key={item.id} className="bg-white border border-stone-100 rounded-2xl p-4 shadow-sm hover:shadow-md transition space-y-3">
                                                <div className="flex items-center justify-between">
                                                    <span className={`text-[10px] font-bold px-2 py-0.5 rounded-full ${item.type === 'offer' ? 'bg-sage-100 text-sage-700' : 'bg-orange-100 text-terracotta-600'}`}>
                                                        {item.category}
                                                    </span>
                                                    <span className="text-xs font-bold bg-amber-50 text-amber-800 px-2 py-0.5 rounded-full border border-amber-200">
                                                        ⏱ {item.hours}h (Créditos)
                                                    </span>
                                                </div>

                                                <div>
                                                    <h3 className="font-bold text-stone-900 text-sm">{item.title}</h3>
                                                    <p className="text-xs text-stone-600 mt-1 line-clamp-2">{item.description}</p>
                                                </div>

                                                <div className="flex items-center justify-between pt-2 border-t border-stone-100">
                                                    <div className="flex items-center space-x-2">
                                                        <img src={item.userAvatar} alt={item.userName} className="w-7 h-7 rounded-full object-cover" />
                                                        <div>
                                                            <p className="text-xs font-semibold text-stone-800">{item.userName}</p>
                                                            <p className="text-[10px] text-stone-400">📍 {item.userNeighborhood}</p>
                                                        </div>
                                                    </div>
                                                    <button 
                                                        onClick={() => requestExchange(item)}
                                                        className="bg-sage-600 hover:bg-sage-700 text-white text-xs px-3.5 py-1.5 rounded-xl font-medium shadow transition"
                                                    >
                                                        Solicitar
                                                    </button>
                                                </div>
                                            </div>
                                        ))
                                    )}
                                </div>
                            </div>
                        )}

                        {activeTab === 'create' && (
                            <div className="p-4 space-y-4">
                                <h2 className="font-bold text-stone-900 text-base">Publicar Anuncio</h2>
                                <form onSubmit={handleCreateListing} className="space-y-4 text-xs">
                                    <div>
                                        <label className="block font-semibold text-stone-700 mb-1">Tipo de Anuncio</label>
                                        <div className="flex gap-2">
                                            <button 
                                                type="button"
                                                onClick={() => setNewListing({...newListing, type: 'offer'})}
                                                className={`flex-1 py-2 font-bold rounded-xl border ${newListing.type === 'offer' ? 'bg-sage-600 text-white border-sage-600' : 'bg-white text-stone-600 border-stone-200'}`}
                                            >
                                                Ofrezco habilidad
                                            </button>
                                            <button 
                                                type="button"
                                                onClick={() => setNewListing({...newListing, type: 'request'})}
                                                className={`flex-1 py-2 font-bold rounded-xl border ${newListing.type === 'request' ? 'bg-terracotta-500 text-white border-terracotta-500' : 'bg-white text-stone-600 border-stone-200'}`}
                                            >
                                                Solicito ayuda
                                            </button>
                                        </div>
                                    </div>

                                    <div>
                                        <label className="block font-semibold text-stone-700 mb-1">Título</label>
                                        <input 
                                            type="text" 
                                            required
                                            placeholder="Ej. Clases de informática básica"
                                            value={newListing.title}
                                            onChange={e => setNewListing({...newListing, title: e.target.value})}
                                            className="w-full px-3 py-2 bg-stone-50 border border-stone-200 rounded-xl outline-none focus:ring-2 focus:ring-sage-500 text-sm"
                                        />
                                    </div>

                                    <div className="grid grid-cols-2 gap-2">
                                        <div>
                                            <label className="block font-semibold text-stone-700 mb-1">Categoría</label>
                                            <select 
                                                value={newListing.category}
                                                onChange={e => setNewListing({...newListing, category: e.target.value})}
                                                className="w-full px-3 py-2 bg-stone-50 border border-stone-200 rounded-xl outline-none text-xs"
                                            >
                                                {categories.filter(c => c !== 'Todas').map(c => <option key={c} value={c}>{c}</option>)}
                                            </select>
                                        </div>
                                        <div>
                                            <label className="block font-semibold text-stone-700 mb-1">Duración (Horas)</label>
                                            <select 
                                                value={newListing.hours}
                                                onChange={e => setNewListing({...newListing, hours: parseFloat(e.target.value)})}
                                                className="w-full px-3 py-2 bg-stone-50 border border-stone-200 rounded-xl outline-none text-xs"
                                            >
                                                <option value={0.5}>0.5h (30 min)</option>
                                                <option value={1.0}>1.0h</option>
                                                <option value={1.5}>1.5h</option>
                                                <option value={2.0}>2.0h</option>
                                                <option value={3.0}>3.0h</option>
                                            </select>
                                        </div>
                                    </div>

                                    <div>
                                        <label className="block font-semibold text-stone-700 mb-1">Descripción</label>
                                        <textarea 
                                            required
                                            rows="3"
                                            placeholder="Detalla qué ofreces o necesitas..."
                                            value={newListing.description}
                                            onChange={e => setNewListing({...newListing, description: e.target.value})}
                                            className="w-full px-3 py-2 bg-stone-50 border border-stone-200 rounded-xl outline-none focus:ring-2 focus:ring-sage-500 text-sm"
                                        />
                                    </div>

                                    <button type="submit" className="w-full py-3 bg-sage-600 hover:bg-sage-700 text-white font-bold rounded-xl shadow transition text-sm">
                                        Publicar Anuncio
                                    </button>
                                </form>
                            </div>
                        )}

                        {activeTab === 'exchanges' && (
                            <div className="p-4 space-y-4">
                                <div className="flex justify-between items-center">
                                    <h2 className="font-bold text-stone-900 text-base">Mis Intercambios</h2>
                                    <div className="flex gap-1 text-[10px]">
                                        <button onClick={() => setExchangeFilter('all')} className={`px-2 py-1 rounded ${exchangeFilter === 'all' ? 'bg-sage-600 text-white font-bold' : 'bg-stone-100 text-stone-600'}`}>Todos</button>
                                        <button onClick={() => setExchangeFilter('active')} className={`px-2 py-1 rounded ${exchangeFilter === 'active' ? 'bg-sage-600 text-white font-bold' : 'bg-stone-100 text-stone-600'}`}>Escrow</button>
                                        <button onClick={() => setExchangeFilter('completed')} className={`px-2 py-1 rounded ${exchangeFilter === 'completed' ? 'bg-sage-600 text-white font-bold' : 'bg-stone-100 text-stone-600'}`}>Hechos</button>
                                    </div>
                                </div>

                                {activeChatExchange ? (
                                    <div className="bg-stone-50 border border-stone-200 rounded-2xl p-4 space-y-3">
                                        <div className="flex justify-between items-center border-b border-stone-200 pb-2">
                                            <div>
                                                <span className="text-[10px] font-bold bg-amber-100 text-amber-800 px-2 py-0.5 rounded">Escrow Activo</span>
                                                <h3 className="font-bold text-stone-900 text-xs mt-1">{activeChatExchange.listingTitle}</h3>
                                            </div>
                                            <button onClick={() => setActiveChatExchange(null)} className="text-stone-400 hover:text-stone-700 text-xs font-semibold">✕ Volver</button>
                                        </div>

                                        <div className="space-y-2 h-44 overflow-y-auto pr-1 bg-white p-3 rounded-xl border border-stone-100">
                                            {activeChatExchange.messages.map((m, i) => (
                                                <div key={i} className={`flex flex-col ${m.sender === currentUser.id ? 'items-end' : 'items-start'}`}>
                                                    <div className={`max-w-[80%] p-2 rounded-xl text-xs ${m.sender === currentUser.id ? 'bg-sage-600 text-white rounded-br-none' : 'bg-stone-100 text-stone-800 rounded-bl-none'}`}>
                                                        {m.text}
                                                    </div>
                                                    <span className="text-[9px] text-stone-400 mt-0.5">{m.time}</span>
                                                </div>
                                            ))}
                                        </div>

                                        <form onSubmit={sendChatMessage} className="flex gap-2">
                                            <input 
                                                type="text" 
                                                placeholder="Escribe un mensaje..."
                                                value={chatMessageText}
                                                onChange={e => setChatMessageText(e.target.value)}
                                                className="flex-1 px-3 py-2 text-xs bg-white border border-stone-200 rounded-xl outline-none"
                                            />
                                            <button type="submit" className="bg-sage-600 text-white px-4 py-2 text-xs font-bold rounded-xl">Enviar</button>
                                        </form>

                                        {activeChatExchange.status !== 'completed' && (
                                            <button 
                                                onClick={() => completeExchange(activeChatExchange.id)}
                                                className="w-full py-2 bg-amber-500 hover:bg-amber-600 text-white font-bold rounded-xl text-xs shadow transition"
                                            >
                                                ✅ Marcar como Completado (Liberar {activeChatExchange.hours}h)
                                            </button>
                                        )}
                                    </div>
                                ) : (
                                    <div className="space-y-3">
                                        {filteredExchanges.length === 0 ? (
                                            <p className="text-xs text-stone-400 text-center py-8">No hay intercambios en esta vista.</p>
                                        ) : (
                                            filteredExchanges.map(ex => {
                                                const otherUserId = ex.requesterId === currentUser.id ? ex.providerId : ex.requesterId;
                                                const otherUser = users.find(u => u.id === otherUserId) || { name: 'Vecino' };
                                                return (
                                                    <div key={ex.id} className="bg-white border border-stone-100 rounded-2xl p-4 shadow-sm space-y-2">
                                                        <div className="flex justify-between items-start">
                                                            <div>
                                                                <span className={`text-[10px] font-bold px-2 py-0.5 rounded ${ex.status === 'completed' ? 'bg-emerald-100 text-emerald-800' : 'bg-amber-100 text-amber-800'}`}>
                                                                    {ex.status === 'completed' ? 'Completado' : 'Escrow (Retenido)'}
                                                                </span>
                                                                <h4 className="font-bold text-stone-900 text-xs mt-1">{ex.listingTitle}</h4>
                                                            </div>
                                                            <span className="text-xs font-bold text-amber-700">⏱ {ex.hours}h</span>
                                                        </div>
                                                        <p className="text-xs text-stone-500">Con: <span className="font-semibold text-stone-800">{otherUser.name}</span></p>
                                                        <div className="flex justify-between pt-2 border-t border-stone-100">
                                                            <button onClick={() => setActiveChatExchange(ex)} className="text-xs text-sage-700 font-bold hover:underline">
                                                                💬 Abrir chat y detalles →
                                                            </button>
                                                        </div>
                                                    </div>
                                                );
                                            })
                                        )}
                                    </div>
                                )}
                            </div>
                        )}

                        {activeTab === 'profile' && (
                            <div className="p-4 space-y-4">
                                <div className="bg-sage-50 rounded-2xl p-4 text-center space-y-2 border border-sage-100">
                                    <img src={currentUser.avatar} alt={currentUser.name} className="w-20 h-20 rounded-full mx-auto object-cover border-2 border-sage-500 shadow" />
                                    <h2 className="font-bold text-stone-900 text-base">{currentUser.name}</h2>
                                    <p className="text-xs text-stone-500">📍 {currentUser.neighborhood}</p>
                                    <div className="flex justify-center gap-1 pt-1 flex-wrap">
                                        {currentUser.badges.map((b, i) => (
                                            <span key={i} className="text-[10px] bg-white text-sage-700 font-semibold px-2 py-0.5 rounded-full border border-sage-200 shadow-sm">{b}</span>
                                        ))}
                                    </div>
                                </div>

                                <div className="bg-white border border-stone-100 rounded-2xl p-4 space-y-3">
                                    <h3 className="font-bold text-stone-800 text-xs uppercase tracking-wider">Mi Billetera de Tiempo</h3>
                                    <div className="flex justify-between items-center bg-stone-50 p-3 rounded-xl border border-stone-200">
                                        <div>
                                            <p className="text-xs text-stone-500">Saldo disponible</p>
                                            <p className="text-lg font-bold text-amber-600">⏱ {currentUser.hours.toFixed(1)} Horas</p>
                                        </div>
                                        <div className="text-right">
                                            <p className="text-[10px] text-stone-400">Límite de deuda</p>
                                            <p className="text-xs font-semibold text-stone-700">-2.0 Horas</p>
                                        </div>
                                    </div>
                                </div>

                                <div className="bg-white border border-stone-100 rounded-2xl p-4 space-y-2">
                                    <h3 className="font-bold text-stone-800 text-xs uppercase tracking-wider">Cambiar perfil de prueba</h3>
                                    <div className="grid grid-cols-2 gap-2 pt-1">
                                        {users.map(u => (
                                            <button 
                                                key={u.id}
                                                onClick={() => setCurrentUser(u)}
                                                className={`p-2 rounded-xl text-left border text-xs flex items-center space-x-2 ${currentUser.id === u.id ? 'border-sage-500 bg-sage-50 font-bold' : 'border-stone-200 bg-stone-50'}`}
                                            >
                                                <img src={u.avatar} className="w-6 h-6 rounded-full object-cover" />
                                                <div className="truncate">
                                                    <p className="truncate">{u.name}</p>
                                                    <span className="text-[10px] text-amber-600 font-normal">{u.hours}h</span>
                                                </div>
                                            </button>
                                        ))}
                                    </div>
                                </div>
                            </div>
                        )}
                    </main>

                    {/* Bottom Nav */}
                    <nav className="absolute bottom-0 left-0 right-0 bg-white border-t border-stone-200 py-2 px-6 flex justify-around items-center z-40 shadow-lg">
                        <button onClick={() => setActiveTab('explore')} className={`flex flex-col items-center space-y-0.5 text-xs font-medium transition ${activeTab === 'explore' ? 'text-sage-600 font-bold' : 'text-stone-400 hover:text-stone-600'}`}>
                            <span className="text-lg">🧭</span>
                            <span>Explorar</span>
                        </button>
                        <button onClick={() => setActiveTab('create')} className={`flex flex-col items-center space-y-0.5 text-xs font-medium transition ${activeTab === 'create' ? 'text-sage-600 font-bold' : 'text-stone-400 hover:text-stone-600'}`}>
                            <span className="text-lg">➕</span>
                            <span>Publicar</span>
                        </button>
                        <button onClick={() => setActiveTab('exchanges')} className={`flex flex-col items-center space-y-0.5 text-xs font-medium transition ${activeTab === 'exchanges' ? 'text-sage-600 font-bold' : 'text-stone-400 hover:text-stone-600'}`}>
                            <span className="text-lg">💬</span>
                            <span>Intercambios</span>
                        </button>
                        <button onClick={() => setActiveTab('profile')} className={`flex flex-col items-center space-y-0.5 text-xs font-medium transition ${activeTab === 'profile' ? 'text-sage-600 font-bold' : 'text-stone-400 hover:text-stone-600'}`}>
                            <span className="text-lg">👤</span>
                            <span>Perfil</span>
                        </button>
                    </nav>
                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
